<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password</title>
<style>
  body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#0d1a1e;color:#e8f0f1;
    margin:0;padding:40px 20px;max-width:360px;margin-inline:auto}
  h1{font-size:20px}
  input{width:100%;padding:11px;border-radius:8px;border:1px solid rgba(255,255,255,.15);
    background:#132228;color:#fff;margin-bottom:10px;font-size:14px}
  button{width:100%;padding:11px;border:none;border-radius:8px;background:#e8a33d;color:#0d1a1e;
    font-weight:700;cursor:pointer;font-size:14px}
  .msg{margin-top:10px;font-size:13px;padding:10px;border-radius:8px;display:none}
  .msg.show{display:block}
  .msg.ok{background:rgba(46,196,182,.12);color:#2ec4b6}
  .msg.err{background:rgba(255,107,107,.12);color:#ff6b6b}
  .pwd-wrap{position:relative}
  .pwd-wrap input{padding-right:40px;margin-bottom:0}
  .pwd-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;
    border:none;cursor:pointer;font-size:16px;padding:4px 6px;margin:0;color:#6b8a91;line-height:1}
</style>
</head>
<body>
<div id="yournetLangSwitcherContainer" style="display:flex;justify-content:flex-end;margin-bottom:10px"></div>
<h1 data-i18n="setNewPassword">Set a new password</h1>
<div class="pwd-wrap" style="margin-bottom:10px">
  <input id="newPassword" type="password" data-i18n-placeholder="newPasswordPlaceholder" placeholder="New password">
  <button type="button" class="pwd-toggle" onclick="togglePwd('newPassword')" aria-label="Show password">👁</button>
</div>
<button onclick="submit_()" data-i18n="updatePassword">Update password</button>
<div class="msg" id="msg"></div>

<script src="/i18n/translations.js"></script>
<script src="/i18n/i18n-loader.js"></script>
<script>
  const token = new URLSearchParams(window.location.search).get('token');

  function togglePwd(id) {
    const input = document.getElementById(id);
    const btn = input.nextElementSibling;
    if (input.type === 'password') {
      input.type = 'text';
      btn.textContent = '🙈';
      btn.setAttribute('aria-label', 'Hide password');
    } else {
      input.type = 'password';
      btn.textContent = '👁';
      btn.setAttribute('aria-label', 'Show password');
    }
  }

  async function submit_() {
    const msg = document.getElementById('msg');
    if (!token) {
      msg.textContent = 'No reset token found in this link.';
      msg.className = 'msg show err';
      return;
    }
    const res = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, newPassword: document.getElementById('newPassword').value }),
    });
    const data = await res.json();
    if (!res.ok) {
      msg.textContent = data.error || 'Could not reset password.';
      msg.className = 'msg show err';
      return;
    }
    msg.textContent = 'Password updated - you can log in now.';
    msg.className = 'msg show ok';
  }
</script>
</body>
</html>
