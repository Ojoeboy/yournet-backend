<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password</title>
<style>
  body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#0d1a1e;color:#e8f0f1;
    margin:0;padding:40px 20px;max-width:360px;margin-inline:auto}
  h1{font-size:20px}
  input{width:100%;padding:11px;border-radius:8px;border:1px solid rgba(255,255,255,.15);
    background:#132228;color:#fff;margin-bottom:10px;font-size:14px}
  button{width:100%;padding:11px;border:none;border-radius:8px;background:#e8a33d;color:#0d1a1e;
    font-weight:700;cursor:pointer;font-size:14px}
  .msg{margin-top:10px;font-size:13px;padding:10px;border-radius:8px;display:none}
  .msg.show{display:block;background:rgba(46,196,182,.12);color:#2ec4b6}
</style>
</head>
<body>
<div id="yournetLangSwitcherContainer" style="display:flex;justify-content:flex-end;margin-bottom:10px"></div>
<h1 data-i18n="resetYourPassword">Reset your password</h1>
<input id="email" type="email" data-i18n-placeholder="accountEmail" placeholder="Your account email">
<button onclick="submit_()" data-i18n="sendResetLink">Send reset link</button>
<div class="msg" id="msg"></div>

<script src="/i18n/translations.js"></script>
<script src="/i18n/i18n-loader.js"></script>
<script>
  async function submit_() {
    const res = await fetch('/api/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: document.getElementById('email').value }),
    });
    const data = await res.json();
    const msg = document.getElementById('msg');
    msg.textContent = data.message || 'If that email has an account, a reset link has been sent.';
    msg.className = 'msg show';
  }
</script>
</body>
</html>
