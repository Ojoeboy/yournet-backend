<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="{{PRIMARY_COLOR}}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="{{BUSINESS_NAME}}">
<link rel="manifest" href="/p/{{SITE_ID}}/manifest.json">
<link rel="apple-touch-icon" href="{{ICON_URL}}">
<title>{{BUSINESS_NAME}}</title>
<style>
  /* System fonts only - no external CDN calls. The device has no internet
     yet, so anything loaded from a CDN will just fail to render. */
  :root{
    --ink:#080F12;--panel:rgba(20,40,46,0.9);--gold:{{PRIMARY_COLOR}};--gold2:{{PRIMARY_COLOR_2}};
    --teal:#2EC4B6;--cream:#E8F0F1;--muted:#6B8A91;--danger:#FF6B6B;--line:rgba(255,255,255,0.1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100vh;background:var(--ink);color:var(--cream);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  body{background:radial-gradient(900px 600px at 20% -10%,rgba(46,196,182,0.16),transparent),
    radial-gradient(700px 500px at 90% 100%,rgba(232,163,61,0.1),transparent),var(--ink);
    display:flex;align-items:center;justify-content:center;padding:20px}
  .card{width:100%;max-width:380px;background:linear-gradient(180deg,rgba(20,40,46,0.92),rgba(13,26,30,0.85));
    border:1px solid var(--line);border-radius:22px;padding:26px 22px;box-shadow:0 20px 50px rgba(0,0,0,0.5)}
  /* Glass mode: added to <body> only once a background photo (custom or
     rotating) is actually showing - see loadPortalExtras() below. Without
     a photo behind it there's nothing to see through, so the card stays
     at its normal near-opaque look otherwise. */
  body.yn-glass .card{background:rgba(20,40,46,.32);backdrop-filter:blur(18px) saturate(150%);
    -webkit-backdrop-filter:blur(18px) saturate(150%);border-color:rgba(255,255,255,.18)}
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    body.yn-glass .card{background:linear-gradient(180deg,rgba(20,40,46,0.92),rgba(13,26,30,0.85))}
  }
  .logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:16px}
  .logo .box{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#1A363E,#14282E);
    border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--teal)}
  h1{font-size:20px;margin:0 0 4px;text-align:center}
  .sub{font-size:12.5px;color:var(--muted);text-align:center;margin:0 0 20px;line-height:1.4}
  label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;display:block;margin-bottom:6px}
  input{width:100%;background:rgba(0,0,0,0.3);border:1px solid var(--line);color:var(--cream);
    border-radius:12px;padding:14px;font-size:16px;text-align:center;letter-spacing:2px;text-transform:uppercase;font-weight:700}
  input:focus{outline:none;border-color:rgba(232,163,61,.5)}
  button{width:100%;margin-top:14px;padding:14px;border:none;border-radius:12px;font-weight:700;font-size:15px;
    background:linear-gradient(135deg,var(--gold),var(--gold2));color:#080F12;cursor:pointer}
  button:disabled{opacity:.6}
  .msg{margin-top:14px;font-size:13px;text-align:center;padding:10px;border-radius:10px;display:none}
  .msg.show{display:block}
  .msg.err{background:rgba(255,107,107,.12);color:var(--danger);border:1px solid rgba(255,107,107,.25)}
  .msg.ok{background:rgba(46,196,182,.12);color:var(--teal);border:1px solid rgba(46,196,182,.25)}
  .success{display:none;text-align:center}
  .success.show{display:block}
  .success .tick{font-size:40px;margin-bottom:6px}
  .success h2{margin:0 0 6px;font-size:18px}
  .success p{color:var(--muted);font-size:13px;margin:0}
  .footer{margin-top:18px;font-size:11px;color:var(--muted);text-align:center}

  /* Optional extras - all hidden by default, shown only if the site has
     set the corresponding field (see /portal/:siteId/config). */
  .caution-box{display:none;margin-bottom:16px;padding:12px 14px;border-radius:12px;font-size:12.5px;line-height:1.5;
    background:rgba(255,167,38,0.1);border:1px solid rgba(255,167,38,0.3);color:#FFC876}
  .caution-box.show{display:block}
  .wrap-outer{width:100%;max-width:380px}
  .packages-section{display:none;margin-top:18px}
  .packages-section.show{display:block}
  .packages-section h3{font-size:13px;margin:0 0 10px;text-align:center;color:var(--muted);
    text-transform:uppercase;letter-spacing:.06em;font-weight:700}
  .pkg-card{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;margin-bottom:8px;
    background:rgba(0,0,0,0.25);border:1px solid var(--line);border-radius:12px}
  .pkg-card .pkg-info{text-align:left}
  .pkg-card .pkg-label{font-weight:700;font-size:13.5px}
  .pkg-card .pkg-price{font-size:12px;color:var(--muted);margin-top:2px}
  .pkg-buy{width:auto;margin:0;padding:9px 16px;font-size:12.5px;border-radius:9px;flex-shrink:0}
  .momo-box{display:none;margin-top:14px;padding:14px;border-radius:12px;background:rgba(46,196,182,0.08);
    border:1px solid rgba(46,196,182,0.25);font-size:12.5px;line-height:1.5;text-align:center}
  .momo-box.show{display:block}
  .momo-box .momo-number{font-size:17px;font-weight:800;letter-spacing:1px;margin:4px 0;color:var(--teal)}
  .help-link{display:none;margin-top:10px;text-align:center}
  .help-link.show{display:block}
  .help-link a{color:var(--teal);font-size:12.5px;text-decoration:none;font-weight:600}
  .help-link .sep{color:#5a7a80;margin:0 8px;font-size:11px}
  .phone-input{margin-top:10px}
  .phone-input input{text-transform:none;letter-spacing:normal;font-size:14px;font-weight:400;text-align:left}
</style>
</head>
<body>
  <div class="wrap-outer">
    <div class="caution-box" id="caution-box"></div>

    <div class="card">
      <div style="display:flex;justify-content:flex-end;margin-bottom:6px" id="yournetLangSwitcherContainer"></div>
      <div class="logo">{{LOGO_HTML}}<div style="font-weight:700">{{BUSINESS_NAME}}</div></div>

      <div id="form-view">
        <h1 data-i18n="enterCode">Enter your voucher code</h1>
        <p class="sub" data-i18n="typeCodeHint">Type the code from your card or receipt to get online.</p>
        <label for="code" data-i18n="voucherCodeLabel">Voucher Code</label>
        <input id="code" type="text" placeholder="XXXX-XXXX" maxlength="9" autocomplete="off" autocapitalize="characters">
        <button id="submitBtn" onclick="redeem()" data-i18n="connectBtn">Connect</button>
        <div class="msg" id="msg"></div>
      </div>

      <div class="success" id="success-view">
        <div class="tick">✅</div>
        <h2 data-i18n="connectedTitle">You're connected!</h2>
        <p id="expiry-text" data-i18n="connectedSub">Enjoy your internet access.</p>
      </div>

      <div class="packages-section" id="packages-section">
        <h3 data-i18n="buyVoucherHeading">Don't have a code? Buy one now</h3>
        <div id="packages-list"></div>
        <div class="phone-input" id="phone-input-wrap" style="display:none">
          <label for="buyerPhone" data-i18n="phoneForVoucher">Phone number (to receive your code)</label>
          <input id="buyerPhone" type="tel" placeholder="024xxxxxxx" autocomplete="tel">
        </div>
        <div class="msg" id="buy-msg"></div>
      </div>

      <div class="momo-box" id="momo-box"></div>
      <div class="help-link" id="help-link"></div>

      <div class="footer" data-i18n="poweredBy">Powered by YourNet Control</div>
    </div>
  </div>

<script src="/i18n/translations.js"></script>
<script src="/i18n/i18n-loader.js"></script>
<script>
  const t = window.yournetI18n.t;

  // Server returns REASON CODES, not English text, so they can be
  // translated into whatever language the customer has selected.
  const REASON_MESSAGES = {
    not_found: 'errNotFound',
    already_used: 'errAlreadyUsed',
    unsupported_site_type: 'errUnsupportedSite',
    network_error: 'errNetwork',
    missing_meraki_grant_url: 'errMerakiNoGrantUrl',
  };
</script>
<script>
  // siteId comes from the portal URL path: /p/{siteId}
  const pathParts = window.location.pathname.split('/').filter(Boolean);
  const siteId = pathParts[pathParts.length - 1];

  // Omada / Mikrotik both append connection details as query params when
  // they redirect a newly-joined device to this external login page.
  const params = new URLSearchParams(window.location.search);
  const clientMac = params.get('clientMac') || params.get('mac') || '';
  const apMac = params.get('apMac') || '';
  const ssidName = params.get('ssidName') || params.get('ssid') || '';
  const radioId = params.get('radioId') || '';
  // Cisco Meraki appends these on its splash redirect - see
  // src/integrations/meraki.js for what they're used for. Absent entirely
  // for Mikrotik/Omada/UniFi sites, which is fine - the backend only needs
  // them for Meraki-type sites.
  const baseGrantUrl = params.get('base_grant_url') || '';
  const continueUrl = params.get('user_continue_url') || '';
  // Present when this page was opened by scanning a voucher's QR code
  // (see /:id/qrcode in routes/vouchers.js and routes/agents.js) - the QR
  // now encodes this portal URL with the code embedded, instead of just
  // the bare code, so a scan can go straight to "connected" instead of
  // making the customer type the code in by hand.
  const qrCode = params.get('code') || '';

  const codeInput = document.getElementById('code');
  const msgEl = document.getElementById('msg');
  const submitBtn = document.getElementById('submitBtn');

  codeInput.addEventListener('input', () => {
    // auto-format as XXXX-XXXX while typing
    let v = codeInput.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (v.length > 4) v = v.slice(0, 4) + '-' + v.slice(4, 8);
    codeInput.value = v;
  });

  function showMsg(text, type) {
    msgEl.textContent = text;
    msgEl.className = 'msg show ' + type;
  }

  async function redeem() {
    const code = codeInput.value.trim();
    if (!code || code.length < 8) {
      showMsg(t('enterFullCode'), 'err');
      return;
    }
    submitBtn.disabled = true;
    submitBtn.textContent = t('loading');
    msgEl.className = 'msg';

    try {
      const res = await fetch(`/portal/${siteId}/redeem`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code, clientMac, apMac, ssidName, radioId, baseGrantUrl, continueUrl }),
      });
      const data = await res.json();

      if (!res.ok || !data.ok) {
        const key = REASON_MESSAGES[data.reason] || 'errNetwork';
        showMsg(t(key), 'err');
        submitBtn.disabled = false;
        submitBtn.textContent = t('connectBtn');
        return;
      }

      document.getElementById('form-view').style.display = 'none';
      document.getElementById('success-view').classList.add('show');
      if (data.expiresAt) {
        const exp = new Date(data.expiresAt);
        document.getElementById('expiry-text').textContent = exp.toLocaleString();
      }
      // Meraki: the voucher is valid, but access isn't actually granted
      // until THIS browser requests data.redirectUrl (Meraki ties the
      // grant to the requesting IP - see src/integrations/meraki.js).
      // Every other provider already authorized the client server-side,
      // so redirectUrl is null for them and this is skipped.
      if (data.redirectUrl) {
        window.location.href = data.redirectUrl;
        return;
      }
      // Give the router a moment to apply access, then try to move the
      // browser off the portal page so normal browsing can resume.
      setTimeout(() => {
        window.location.href = params.get('originUrl') || params.get('redirectUrl') || 'http://neverssl.com';
      }, 2500);
    } catch (err) {
      showMsg(t('errNetwork'), 'err');
      submitBtn.disabled = false;
      submitBtn.textContent = t('connectBtn');
    }
  }

  codeInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') redeem(); });

  // Scanned in via QR: pre-fill (through the same formatter as manual
  // typing, so it displays as XXXX-XXXX) and auto-submit. This makes
  // "scan the QR" behave like an actual one-tap connect for the common
  // case - but redeem() still runs the exact same request a manual
  // entry would, so a code that's expired/already-used/wrong-site fails
  // exactly the same way it would for manual entry; scanning doesn't
  // grant anything scanning-specific, it just skips the typing.
  if (qrCode) {
    codeInput.value = qrCode;
    codeInput.dispatchEvent(new Event('input'));
    redeem();
  }

  // Load optional extras (background image, caution notice, packages,
  // manual MoMo, WhatsApp help link) - all off by default until the site's
  // config says otherwise. Failing silently here is intentional: the core
  // voucher-redeem flow above must keep working even if this call fails.
  let portalPackages = [];
  let onlinePaymentAvailable = false;
  let manualMomoAvailable = false;
  let manualMomoNumber = null;
  let manualMomoName = null;
  let portalCurrency = 'GHS';

  // Tenant-entered strings (help email/phone) get interpolated into
  // innerHTML below, so escape them first - this is public, unauthenticated
  // customer-facing HTML.
  function escapePortalHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function setBodyBackground(url) {
    document.body.style.backgroundImage =
      `linear-gradient(rgba(8,15,18,0.5),rgba(8,15,18,0.6)), url("${url}")`;
    document.body.style.backgroundSize = 'cover';
    document.body.style.backgroundPosition = 'center';
    document.body.style.backgroundAttachment = 'fixed';
    document.body.classList.add('yn-glass');
  }

  // Cycles through a set of free stock photos (default portal background
  // when the tenant hasn't uploaded their own) every 2 minutes, with a
  // brief opacity fade so the swap doesn't look like a jump-cut. Preloads
  // the next image before switching to it, so there's never a blank/broken
  // frame if a URL is slow to load.
  function startBackgroundRotation(urls) {
    let i = 0;
    setBodyBackground(urls[i]);
    document.body.style.transition = 'background-image 1.2s ease-in-out';

    setInterval(() => {
      i = (i + 1) % urls.length;
      const preload = new Image();
      preload.onload = () => setBodyBackground(urls[i]);
      preload.onerror = () => { /* skip a broken URL, keep the current background */ };
      preload.src = urls[i];
    }, 2 * 60 * 1000);
  }

  async function loadPortalExtras() {
    try {
      const res = await fetch(`/portal/${siteId}/config`);
      if (!res.ok) return;
      const cfg = await res.json();

      if (cfg.backgroundImageUrl) {
        setBodyBackground(cfg.backgroundImageUrl);
      } else if (cfg.rotatingBackgrounds && cfg.rotatingBackgrounds.length) {
        startBackgroundRotation(cfg.rotatingBackgrounds);
      }

      if (cfg.cautionText) {
        const box = document.getElementById('caution-box');
        box.textContent = cfg.cautionText;
        box.classList.add('show');
      }

      onlinePaymentAvailable = !!cfg.onlinePaymentAvailable;
      // Manual MoMo (pay the owner's personal number, owner approves by
      // hand) is only offered as a FALLBACK when there's no real gateway -
      // if the owner has Hubtel/Paystack/Flutterwave active, that's the
      // funnel: instant, no waiting on the owner to notice a payment.
      manualMomoAvailable = !onlinePaymentAvailable && !!cfg.momoNumber;
      manualMomoNumber = cfg.momoNumber;
      manualMomoName = cfg.momoName;
      portalCurrency = cfg.currency || 'GHS';
      portalPackages = cfg.packages || [];
      if (portalPackages.length) renderPackages();

      // Any combination of WhatsApp / email / phone is fine - only render
      // the channels the tenant actually configured for this site. The
      // translated "Need help?" WhatsApp copy stays as the lead link when
      // present (existing behavior, unchanged for tenants with only
      // WhatsApp set up); email/phone are appended as compact icon links.
      const helpParts = [];
      if (cfg.whatsappNumber) {
        const digits = cfg.whatsappNumber.replace(/[^0-9]/g, '');
        helpParts.push(`<a href="https://wa.me/${digits}" target="_blank" rel="noopener">${t('needHelp')}</a>`);
      }
      if (cfg.helpEmail) {
        helpParts.push(`<a href="mailto:${cfg.helpEmail}">✉ ${escapePortalHtml(cfg.helpEmail)}</a>`);
      }
      if (cfg.helpPhone) {
        helpParts.push(`<a href="tel:${cfg.helpPhone}">☎ ${escapePortalHtml(cfg.helpPhone)}</a>`);
      }
      if (helpParts.length) {
        const link = document.getElementById('help-link');
        link.innerHTML = helpParts.join('<span class="sep">|</span>');
        link.classList.add('show');
      }
    } catch (err) { /* extras are optional - never block redemption on this */ }
  }

  function renderPackages() {
    const section = document.getElementById('packages-section');
    const list = document.getElementById('packages-list');
    list.innerHTML = portalPackages.map((p) => `
      <div class="pkg-card">
        <div class="pkg-info">
          <div class="pkg-label">${p.label}</div>
          <div class="pkg-price">${portalCurrency} ${p.price}</div>
        </div>
        ${onlinePaymentAvailable
          ? `<button class="pkg-buy" onclick="buyVoucher('${p.id}')">${t('buyBtn')}</button>`
          : manualMomoAvailable
            ? `<button class="pkg-buy" onclick="selectManualPackage('${p.id}', '${p.label.replace(/'/g, "\\'")}', ${p.price})">${t('buyBtn')}</button>`
            : ''}
      </div>
    `).join('');
    if (onlinePaymentAvailable || manualMomoAvailable) {
      document.getElementById('phone-input-wrap').style.display = 'block';
    }
    section.classList.add('show');
  }

  async function buyVoucher(packageId) {
    const buyMsg = document.getElementById('buy-msg');
    const phone = document.getElementById('buyerPhone').value.trim();
    buyMsg.className = 'msg show';
    buyMsg.textContent = t('buying');
    try {
      const res = await fetch(`/portal/${siteId}/buy-voucher`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ packageId, phone: phone || undefined }),
      });
      const data = await res.json();
      if (!res.ok || !data.checkoutUrl) {
        buyMsg.className = 'msg show err';
        buyMsg.textContent = data.error || t('errBuyFailed');
        return;
      }
      window.location.href = data.checkoutUrl;
    } catch (err) {
      buyMsg.className = 'msg show err';
      buyMsg.textContent = t('errBuyFailed');
    }
  }

  // Manual MoMo: picking a package here doesn't pay for anything yet - it
  // just opens the instructions box (owner's MoMo number/name) and remembers
  // which package this claim is for, ready for submitManualMomo() once the
  // customer has actually sent the money and typed in their phone.
  let selectedManualPackageId = null;
  function selectManualPackage(packageId, label, price) {
    selectedManualPackageId = packageId;
    const box = document.getElementById('momo-box');
    box.innerHTML = `
      <div>${t('momoManualTitle')}</div>
      <div class="momo-number">${manualMomoNumber}</div>
      ${manualMomoName ? `<div>${manualMomoName}</div>` : ''}
      <div style="margin-top:6px;color:var(--muted)">${label} - ${portalCurrency} ${price}</div>
      <div style="margin-top:10px;color:var(--muted)">${t('momoManualInstructions')}</div>
      <div class="phone-input" style="margin-top:10px;text-align:left">
        <input id="momoNote" type="text" placeholder="${t('momoRefPlaceholder')}">
      </div>
      <button class="pkg-buy" style="width:100%;margin-top:10px" onclick="submitManualMomo()">${t('momoIveSent')}</button>
    `;
    box.classList.add('show');
    box.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  async function submitManualMomo() {
    const buyMsg = document.getElementById('buy-msg');
    const phone = document.getElementById('buyerPhone').value.trim();
    if (!phone) {
      buyMsg.className = 'msg show err';
      buyMsg.textContent = t('phoneForVoucher');
      return;
    }
    const note = document.getElementById('momoNote') ? document.getElementById('momoNote').value.trim() : '';
    buyMsg.className = 'msg show';
    buyMsg.textContent = t('buying');
    try {
      const res = await fetch(`/portal/${siteId}/buy-voucher-manual`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ packageId: selectedManualPackageId, phone, note: note || undefined }),
      });
      const data = await res.json();
      if (!res.ok || !data.ok) {
        buyMsg.className = 'msg show err';
        buyMsg.textContent = data.error || t('errBuyFailed');
        return;
      }
      buyMsg.className = 'msg show ok';
      buyMsg.textContent = t('momoPendingMsg');
      document.getElementById('momo-box').classList.remove('show');
    } catch (err) {
      buyMsg.className = 'msg show err';
      buyMsg.textContent = t('errBuyFailed');
    }
  }

  loadPortalExtras();

  // PWA install support. Registered defensively - a captive portal device
  // often has no real internet yet (only a path to this server), and some
  // captive-portal browser shells (iOS/Android's mini in-portal webview)
  // don't support service workers at all. Both cases should fail silently,
  // never block voucher redemption.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register(`/p/${siteId}/sw.js`).catch(() => {});
    });
  }
</script>
<script>
// --- Font-size widget, inlined (not a separate <script src>) so this
// page stays a single self-contained file with zero external requests -
// see the comment on the CSP setup in src/server.js for why that matters
// here specifically (device may have no internet access yet). Same code
// as /public/fontsize.js used everywhere else in the app. ---
// YourNet Control - floating font-size control. Include as a plain
// script tag pointing at /fontsize.js near the end of <body> on any page -
// it's fully self-contained (injects its own CSS and markup), doesn't
// depend on shell.css/shell.js being present, and works the same on every
// page it's dropped into.
//
// WHY `zoom` AND NOT REM/ROOT-FONT-SIZE: every page in this app sets font
// sizes in fixed px, not rem, so scaling the root font-size would do
// nothing - none of the actual text is relative to it. CSS `zoom` scales
// the whole rendered page (text, spacing, icons, buttons) together, which
// is what "make everything on the page bigger/smaller" actually means
// here. `zoom` is now supported across Chrome/Edge, Safari 16.4+, and
// Firefox 126+ (2024), which by this app's usage patterns (business
// owners on phones and Windows laptops) covers effectively everyone.
(function () {
  const STORAGE_KEY = 'yournet_font_scale';
  const STEPS = [0.85, 0.9, 1, 1.1, 1.25, 1.4]; // 6 levels, 100% is the default
  const DEFAULT_INDEX = 2;

  function getStoredIndex() {
    const raw = localStorage.getItem(STORAGE_KEY);
    const parsed = raw !== null ? Number(raw) : NaN;
    return STEPS[parsed] !== undefined ? parsed : DEFAULT_INDEX;
  }

  function getScaleTarget() {
    // Same fix as public/fontsize.js: scale the content card, not
    // documentElement/body - the font-size widget itself is
    // position:fixed on <body>, so zooming body would turn it into the
    // widget's containing block and make the widget drift/vanish the
    // same way the shell's bottom nav did on Setup.
    return document.querySelector('.card') || document.body;
  }

  function applyScale(index) {
    getScaleTarget().style.zoom = String(STEPS[index]);
    const label = document.getElementById('yn-fontsize-label');
    if (label) label.textContent = Math.round(STEPS[index] * 100) + '%';
    const minusBtn = document.getElementById('yn-fontsize-minus');
    const plusBtn = document.getElementById('yn-fontsize-plus');
    if (minusBtn) minusBtn.disabled = index === 0;
    if (plusBtn) plusBtn.disabled = index === STEPS.length - 1;
  }

  function setIndex(index) {
    const clamped = Math.max(0, Math.min(STEPS.length - 1, index));
    localStorage.setItem(STORAGE_KEY, String(clamped));
    applyScale(clamped);
    return clamped;
  }

  function injectStyles() {
    const style = document.createElement('style');
    style.textContent = `
      #yn-fontsize-widget{
        position:fixed;right:16px;bottom:20px;z-index:9999;
        display:flex;align-items:center;gap:2px;
        background:rgba(19,34,40,.72);backdrop-filter:blur(14px) saturate(150%);
        -webkit-backdrop-filter:blur(14px) saturate(150%);
        border:1px solid rgba(255,255,255,.14);border-radius:999px;
        padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.35);
        font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
        opacity:0;transform:translateY(8px);
        animation:yn-fs-in .35s ease-out .15s forwards;
      }
      @keyframes yn-fs-in{to{opacity:1;transform:translateY(0)}}
      #yn-fontsize-widget button{
        width:30px;height:30px;border-radius:999px;border:none;cursor:pointer;
        background:transparent;color:#e8f0f1;font-size:13px;font-weight:700;
        display:flex;align-items:center;justify-content:center;
        transition:background .15s ease,color .15s ease,transform .1s ease;
      }
      #yn-fontsize-widget button:hover:not(:disabled){background:rgba(46,196,182,.22);color:#2ec4b6}
      #yn-fontsize-widget button:active:not(:disabled){transform:scale(.9)}
      #yn-fontsize-widget button:disabled{opacity:.3;cursor:default}
      #yn-fontsize-label{
        min-width:38px;text-align:center;font-size:11px;font-weight:600;
        color:#6b8a91;user-select:none;padding:0 2px;
      }
      @media (max-width:760px){
        #yn-fontsize-widget{bottom:84px;right:12px}
      }
      @media print{ #yn-fontsize-widget{display:none} }
    `;
    document.head.appendChild(style);
  }

  function injectWidget() {
    const wrap = document.createElement('div');
    wrap.id = 'yn-fontsize-widget';
    wrap.setAttribute('role', 'group');
    wrap.setAttribute('aria-label', 'Adjust text size');
    wrap.innerHTML = `
      <button id="yn-fontsize-minus" type="button" aria-label="Decrease text size">A−</button>
      <span id="yn-fontsize-label"></span>
      <button id="yn-fontsize-plus" type="button" aria-label="Increase text size">A+</button>
    `;
    document.body.appendChild(wrap);

    let index = getStoredIndex();
    applyScale(index);

    document.getElementById('yn-fontsize-minus').addEventListener('click', () => {
      index = setIndex(index - 1);
    });
    document.getElementById('yn-fontsize-plus').addEventListener('click', () => {
      index = setIndex(index + 1);
    });
  }

  function init() {
    // Apply the stored scale immediately (before the widget itself even
    // renders) so returning visitors never see a flash of default-size text.
    applyScale(getStoredIndex());
    injectStyles();
    injectWidget();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
