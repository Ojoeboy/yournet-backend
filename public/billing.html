<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Billing</title>
<link rel="stylesheet" href="/shell.css">
<style>
  body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--yn-ink);color:var(--yn-cream);margin:0}
  h1{font-size:20px}
  .plan{background:var(--yn-panel);border:1px solid var(--yn-line);border-radius:14px;padding:18px;margin-bottom:14px}
  .plan h2{margin:0 0 4px;color:var(--yn-teal);font-size:16px}
  .plan .price{font-size:22px;font-weight:800;color:var(--yn-gold2);margin:6px 0}
  button{padding:10px 16px;border:none;border-radius:8px;background:var(--yn-gold);color:var(--yn-ink);
    font-weight:700;cursor:pointer;font-size:14px}
  .msg{margin-top:14px;font-size:13px;padding:10px;border-radius:8px;display:none}
  .msg.show{display:block}
  .msg.err{background:rgba(255,107,107,.12);color:var(--yn-danger)}
  .note{font-size:12px;color:var(--yn-muted);margin-top:20px;line-height:1.5;max-width:480px}
</style>
</head>
<body>
<div class="app-shell">
  <div id="app-sidebar"></div>
  <main class="app-main">
<div id="yournetLangSwitcherContainer" style="display:flex;justify-content:flex-end;margin-bottom:10px"></div>
<h1 data-i18n="choosePlan">Choose a plan</h1>

<div class="plan">
  <h2>Starter</h2>
  <div class="price">GHS 50 <span data-i18n="perMonth">/ month</span></div>
  <button onclick="pay('starter')" data-i18n="payWithPaystackBtn">Pay with Paystack</button>
</div>

<div class="plan">
  <h2>Pro</h2>
  <div class="price">GHS 150 <span data-i18n="perMonth">/ month</span></div>
  <button onclick="pay('pro')" data-i18n="payWithPaystackBtn">Pay with Paystack</button>
</div>

<div class="msg" id="msg"></div>

<div class="note">
  Paystack supports card payments and Mobile Money (MTN, Vodafone, AirtelTigo) -
  you'll choose your payment method on the next screen after clicking Pay.
</div>
  </main>
</div>

<script>window.YOURNET_ACTIVE_NAV = 'billing';</script>
<script src="/shell.js"></script>
<script src="/i18n/translations.js"></script>
<script src="/i18n/i18n-loader.js"></script>
<script>
  const token = localStorage.getItem('yournet_token');

  async function pay(planCode) {
    const msg = document.getElementById('msg');
    if (!token) {
      msg.textContent = 'Please log in via /admin first.';
      msg.className = 'msg show err';
      return;
    }
    try {
      const res = await fetch('/billing/initialize', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
        body: JSON.stringify({ planCode }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not start payment');
      window.location.href = data.authorizationUrl;
    } catch (err) {
      msg.textContent = err.message;
      msg.className = 'msg show err';
    }
  }
</script>
</body>
</html>
