<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get YourNet Control</title>
<style>
  body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#0d1a1e;color:#e8f0f1;
    margin:0;padding:20px;max-width:480px;margin-inline:auto}
  h1{font-size:22px}
  .price{font-size:30px;font-weight:800;color:#ffc55a;margin:8px 0 20px}
  .card{background:#132228;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:18px;margin-bottom:16px}
  .card h2{margin:0 0 8px;font-size:15px;color:#2ec4b6}
  input,select{width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,.15);
    background:#0d1a1e;color:#fff;margin-bottom:10px;box-sizing:border-box;font-size:14px}
  button{width:100%;padding:12px;border:none;border-radius:8px;background:#e8a33d;color:#0d1a1e;
    font-weight:700;cursor:pointer;font-size:14px}
  button:disabled{opacity:.6;cursor:default}
  .msg{margin-top:10px;font-size:13px;padding:10px;border-radius:8px;display:none}
  .msg.show{display:block}
  .msg.err{background:rgba(255,107,107,.12);color:#ff6b6b}
  .note{font-size:12px;color:#6b8a91;line-height:1.6}
  /* Glass mode: bg-rotate.js adds this to <body> once a rotating photo
     background is actually showing, so the card goes see-through only then. */
  body.yn-glass .card{background:rgba(19,34,40,.35);backdrop-filter:blur(16px) saturate(150%);
    -webkit-backdrop-filter:blur(16px) saturate(150%);border-color:rgba(255,255,255,.16)}
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    body.yn-glass .card{background:#132228}
  }
</style>
</head>
<body>
<div id="yournetLangSwitcherContainer" style="display:flex;justify-content:flex-end;margin-bottom:10px"></div>
<h1 data-i18n="ownIt">Get YourNet Control</h1>
<div class="price">GHS <span id="priceDisplay">150</span> <span data-i18n="oneTime">to activate</span></div>
<p class="note" style="margin:-14px 0 18px">Then GHS 50/month, billed automatically.</p>

<div class="card">
  <h2 data-i18n="chooseHowToPay">Choose how to pay</h2>
  <select id="provider"></select>
  <input id="email" type="email" data-i18n-placeholder="email" placeholder="Your email (for your activation key)">
  <input id="phone" data-i18n-placeholder="phone" placeholder="Phone number" style="display:none">
  <button id="payBtn" onclick="startCheckout()" data-i18n="payNowBtn">Pay now</button>
  <div class="msg" id="payMsg"></div>
  <p class="note" data-i18n="autoKeyNote">Your activation key is generated automatically the moment payment is confirmed.</p>
</div>

<script src="/bg-rotate.js"></script>
<script src="/i18n/translations.js"></script>
<script src="/i18n/i18n-loader.js"></script>
<script>
  const t = window.yournetI18n.t;
  let providers = [];

  async function loadProviders() {
    const select = document.getElementById('provider');
    const payBtn = document.getElementById('payBtn');
    try {
      const res = await fetch('/license/purchase/providers');
      const data = await res.json();
      providers = data.providers || [];
      if (!providers.length) {
        select.innerHTML = `<option>${t('noPaymentMethodsYet') || 'No payment methods available yet'}</option>`;
        payBtn.disabled = true;
        return;
      }
      select.innerHTML = providers.map(p => `<option value="${p.id}">${p.label}</option>`).join('');
      togglePhoneField();
    } catch (err) {
      select.innerHTML = `<option>${t('noPaymentMethodsYet') || 'No payment methods available yet'}</option>`;
      payBtn.disabled = true;
    }
  }

  function togglePhoneField() {
    const provider = document.getElementById('provider').value;
    // Hubtel requires a phone number to initiate checkout; the others don't.
    document.getElementById('phone').style.display = provider === 'hubtel' ? 'block' : 'none';
  }

  async function startCheckout() {
    const msg = document.getElementById('payMsg');
    const provider = document.getElementById('provider').value;
    const email = document.getElementById('email').value;
    const phone = document.getElementById('phone').value;

    if (!email) {
      msg.textContent = t('email') + ' ' + t('submit');
      msg.className = 'msg show err';
      return;
    }
    if (provider === 'hubtel' && !phone) {
      msg.textContent = t('phone') + ' ' + t('submit');
      msg.className = 'msg show err';
      return;
    }

    try {
      const res = await fetch('/license/purchase/initialize', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ provider, email, phone: phone || undefined }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not start payment');
      window.location.href = data.checkoutUrl;
    } catch (err) {
      msg.textContent = err.message;
      msg.className = 'msg show err';
    }
  }

  document.getElementById('provider').addEventListener('change', togglePhoneField);
  loadProviders();
</script>
</body>
</html>
