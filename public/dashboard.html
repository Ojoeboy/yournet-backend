<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YourNet Dashboard</title>
<link rel="stylesheet" href="/shell.css">
<style>
  *{box-sizing:border-box}
  body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--yn-ink);color:var(--yn-cream);margin:0}
  h1{font-size:20px;margin:0 0 2px}
  .sub{color:var(--yn-muted);font-size:13px;margin-bottom:20px}
  .card{background:var(--yn-panel);border:1px solid var(--yn-line);border-radius:14px;padding:16px;margin-bottom:16px}
  .card h2{font-size:15px;margin:0 0 10px;color:var(--yn-teal)}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{width:100%;min-width:420px;border-collapse:collapse;font-size:13px}
  td,th{padding:6px 4px;border-bottom:1px solid var(--yn-line);text-align:left}
  input,select{padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,.15);
    background:var(--yn-ink);color:#fff;margin-right:6px}
  button{padding:9px 14px;border:none;border-radius:8px;background:var(--yn-gold);color:var(--yn-ink);
    font-weight:700;cursor:pointer;font-size:13px}
  .msg{margin-top:10px;font-size:13px;color:var(--yn-muted)}
  .refresh-note{font-size:11px;color:var(--yn-muted);margin-top:-8px;margin-bottom:16px}
  .range-btn{padding:7px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.15);
    background:var(--yn-panel-2);color:var(--yn-muted);font-size:12px;font-weight:700;
    cursor:pointer;margin-right:4px}
  .range-btn.active{background:rgba(46,196,182,.15);color:var(--yn-teal);border-color:var(--yn-teal)}
  .chart-label{font-size:12px;color:var(--yn-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
  .chart-block{margin-bottom:20px}
  .chart-empty{color:var(--yn-muted);font-size:12.5px;padding:14px 0}
</style>
</head>
<body>
<div class="app-shell">
  <div id="app-sidebar"></div>
  <main class="app-main">
    <div id="yournetLangSwitcherContainer" style="display:flex;justify-content:flex-end;margin-bottom:10px"></div>
    <h1 data-i18n="dashboardTitle">Dashboard</h1>
    <div class="sub" data-i18n="realNumbers">Real numbers from your database - refresh anytime.</div>

    <div class="kpi-grid" id="stats"></div>

    <div class="card">
      <h2>Sites</h2>
      <div class="refresh-note">Status reflects the last connection test. Live client counts refresh every 20s while expanded.</div>
      <div id="siteCards"></div>
    </div>

    <div class="card">
      <h2>Trends</h2>
      <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px">
        <div>
          <button type="button" class="range-btn active" id="range-24h" onclick="setTrendRange('24h')">Last 24h</button>
          <button type="button" class="range-btn" id="range-30d" onclick="setTrendRange('30d')">Last 30 days</button>
        </div>
        <select id="trendSite" onchange="onTrendSiteChange()" style="margin-left:auto;min-width:160px"></select>
      </div>

      <div class="chart-block">
        <div class="chart-label">Revenue</div>
        <div id="chart-revenue"></div>
      </div>
      <div class="chart-block">
        <div class="chart-label">Vouchers sold vs redeemed</div>
        <div id="chart-vouchers"></div>
      </div>
      <div class="chart-block">
        <div class="chart-label">Connected clients — selected site</div>
        <div id="chart-clients"></div>
      </div>
      <div>
        <div class="chart-label">Uptime — selected site</div>
        <div id="chart-uptime"></div>
      </div>
    </div>

    <div class="card">
      <h2 data-i18n="topPackagesTitle">Top packages</h2>
      <div class="table-scroll"><table id="packagesTable"></table></div>
    </div>

    <div class="card">
      <h2 data-i18n="agentsTitle">Agents</h2>
      <div style="margin-bottom:10px">
        <input id="agentName" data-i18n-placeholder="agentNamePlaceholder" placeholder="Agent name">
        <input id="agentCommission" data-i18n-placeholder="commissionPlaceholder" placeholder="Commission %" value="10" style="width:100px">
        <button onclick="addAgent()" data-i18n="addAgentBtn">Add agent</button>
      </div>
      <div class="table-scroll"><table id="agentsTable"></table></div>
      <div class="msg" id="agentMsg"></div>
    </div>
  </main>
</div>

<script>window.YOURNET_ACTIVE_NAV = 'dashboard';</script>
<script src="/shell.js"></script>
<script src="/i18n/translations.js"></script>
<script src="/i18n/i18n-loader.js"></script>
<script>
  const t = window.yournetI18n.t;
  const token = localStorage.getItem('yournet_token');

  // site id -> { expanded, pollTimer }, so only expanded panels poll, and
  // polling stops the moment a card is collapsed or the page is left.
  const liveState = {};

  async function api(path, method = 'GET', body) {
    const res = await fetch(path, {
      method,
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');
    return data;
  }

  async function loadDashboard() {
    if (!token) {
      document.querySelector('.app-main').innerHTML = '<p style="padding:40px;text-align:center">Please log in via <a href="/admin" style="color:#2ec4b6">/admin</a> first.</p>';
      return;
    }

    const s = await api('/api/dashboard/summary');

    document.getElementById('stats').innerHTML = `
      <div class="kpi-card"><div class="num">GHS ${s.revenue}</div><div class="label">${t('totalRevenue')}</div></div>
      <div class="kpi-card"><div class="num">${s.redeemedVouchers}</div><div class="label">${t('vouchersSold')}</div></div>
      <div class="kpi-card"><div class="num">${s.unusedVouchers}</div><div class="label">${t('unusedVouchers')}</div></div>
      <div class="kpi-card"><div class="num">${s.totalVouchers}</div><div class="label">${t('totalGenerated')}</div></div>
    `;

    document.getElementById('packagesTable').innerHTML =
      '<tr><th>Package</th><th>Sold</th></tr>' +
      (s.topPackages.length ? s.topPackages.map(p => `<tr><td>${p.label}</td><td>${p.sold}</td></tr>`).join('')
        : '<tr><td colspan="2" style="color:#6b8a91">No sales yet</td></tr>');

    renderSiteCards(s.sites);
    populateTrendSiteSelect(s.sites);
    reloadTrendCharts();
    await loadAgents();
  }

  function dotClass(status) {
    if (status === 'online') return 'online';
    if (status === 'unconfigured') return 'unconfigured';
    return 'error';
  }

  function renderSiteCards(sites) {
    const container = document.getElementById('siteCards');
    if (!sites.length) {
      container.innerHTML = '<div style="color:var(--yn-muted);font-size:13px">No sites yet - add one in Setup.</div>';
      return;
    }
    const liveCapable = new Set(['mikrotik', 'omada', 'unifi', 'meraki']);
    container.innerHTML = sites.map((site) => `
      <div class="site-card">
        <div class="site-top">
          <div>
            <div class="site-name"><span class="status-dot ${dotClass(site.status)}"></span>${site.name}</div>
            <div class="site-type">${site.type}</div>
          </div>
          ${liveCapable.has(site.type)
            ? `<button class="live-btn" onclick="toggleLive('${site.id}')" id="live-btn-${site.id}">View live clients</button>`
            : `<span style="font-size:11px;color:var(--yn-muted)">Live view not available</span>`}
        </div>
        <div class="live-panel" id="live-panel-${site.id}"></div>
      </div>
    `).join('');
  }

  async function toggleLive(siteId) {
    const panel = document.getElementById(`live-panel-${siteId}`);
    const btn = document.getElementById(`live-btn-${siteId}`);
    const state = liveState[siteId] || (liveState[siteId] = { expanded: false, timer: null });

    if (state.expanded) {
      state.expanded = false;
      panel.classList.remove('show');
      btn.textContent = 'View live clients';
      if (state.timer) clearInterval(state.timer);
      return;
    }

    state.expanded = true;
    panel.classList.add('show');
    btn.textContent = 'Hide live clients';
    await fetchLive(siteId);
    state.timer = setInterval(() => fetchLive(siteId), 20000);
  }

  async function fetchLive(siteId) {
    const panel = document.getElementById(`live-panel-${siteId}`);
    if (!panel) return;
    try {
      const data = await api(`/api/dashboard/sites/${siteId}/live`);
      if (!data.clients.length) {
        panel.innerHTML = '<div class="live-empty">No active clients right now.</div>';
        return;
      }
      panel.innerHTML = `
        <div class="live-count">${data.count} connected</div>
        <table>
          <tr><th>User / MAC</th><th>IP</th><th>Uptime</th></tr>
          ${data.clients.map(c => `<tr><td>${c.user || c.macAddress || '-'}</td><td>${c.address || '-'}</td><td>${c.uptime || '-'}</td></tr>`).join('')}
        </table>
      `;
    } catch (err) {
      panel.innerHTML = `<div class="live-err">${err.message}</div>`;
    }
  }

  // ---------- trend charts ----------
  let trendRange = '24h';
  let trendSiteId = null;

  function populateTrendSiteSelect(sites) {
    const sel = document.getElementById('trendSite');
    const previous = trendSiteId;
    if (!sites.length) {
      sel.innerHTML = '<option value="">No sites yet</option>';
      trendSiteId = null;
      return;
    }
    sel.innerHTML = sites.map((s) => `<option value="${s.id}">${s.name}</option>`).join('');
    // keep the previously-selected site if it still exists, otherwise default to the first one
    trendSiteId = sites.some((s) => s.id === previous) ? previous : sites[0].id;
    sel.value = trendSiteId;
  }

  function onTrendSiteChange() {
    trendSiteId = document.getElementById('trendSite').value || null;
    loadClientsChart();
    loadUptimeChart();
  }

  function setTrendRange(range) {
    trendRange = range;
    document.getElementById('range-24h').classList.toggle('active', range === '24h');
    document.getElementById('range-30d').classList.toggle('active', range === '30d');
    reloadTrendCharts();
  }

  function reloadTrendCharts() {
    loadRevenueChart();
    loadVouchersChart();
    loadClientsChart();
    loadUptimeChart();
  }

  // Minimal dependency-free SVG line chart - deliberately not pulling in a
  // charting library so this page stays consistent with the rest of the
  // app (plain HTML/JS, no build step, no external script dependency).
  // series: [{ name, color, points: [{ t, v }] }]
  function renderChart(containerId, series, opts = {}) {
    const el = document.getElementById(containerId);
    const hasData = series.some((s) => s.points.length > 0);
    if (!hasData) {
      el.innerHTML = '<div class="chart-empty">Not enough data yet — this fills in as hourly snapshots build up.</div>';
      return;
    }

    const W = 640, H = 170, padL = 4, padR = 4, padT = 8, padB = 20;
    const allPoints = series.flatMap((s) => s.points);
    const allT = allPoints.map((p) => new Date(p.t).getTime());
    const allV = allPoints.map((p) => Number(p.v) || 0);
    const minT = Math.min(...allT);
    const maxT = Math.max(...allT);
    const maxV = Math.max(1, ...allV);
    const minV = Math.min(0, ...allV);

    const x = (t) => {
      const ratio = maxT === minT ? 0.5 : (new Date(t).getTime() - minT) / (maxT - minT);
      return padL + ratio * (W - padL - padR);
    };
    const y = (v) => {
      const ratio = maxV === minV ? 0.5 : (Number(v) - minV) / (maxV - minV);
      return H - padB - ratio * (H - padT - padB);
    };

    let svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:170px;display:block">`;
    for (let i = 0; i <= 3; i++) {
      const gy = padT + (i / 3) * (H - padT - padB);
      svg += `<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${W - padR}" y2="${gy.toFixed(1)}" stroke="rgba(255,255,255,.08)" stroke-width="1"/>`;
    }
    series.forEach((s) => {
      if (!s.points.length) return;
      const path = s.points
        .map((p, i) => `${i === 0 ? 'M' : 'L'}${x(p.t).toFixed(1)},${y(p.v).toFixed(1)}`)
        .join(' ');
      svg += `<path d="${path}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
      const last = s.points[s.points.length - 1];
      svg += `<circle cx="${x(last.t).toFixed(1)}" cy="${y(last.v).toFixed(1)}" r="3" fill="${s.color}"/>`;
    });
    svg += '</svg>';

    const legend = series
      .map((s) => {
        const last = s.points.length ? s.points[s.points.length - 1].v : null;
        const val = last === null ? '—' : (opts.formatter ? opts.formatter(last) : last);
        return `<span style="display:inline-flex;align-items:center;gap:5px;margin-right:16px;font-size:11.5px;color:var(--yn-muted)">
          <span style="width:9px;height:9px;border-radius:2px;background:${s.color};display:inline-block"></span>${s.name}: ${val}
        </span>`;
      })
      .join('');

    el.innerHTML = `<div style="margin-bottom:6px">${legend}</div>${svg}`;
  }

  async function loadRevenueChart() {
    try {
      const data = await api(`/api/dashboard/history/revenue?range=${trendRange}`);
      renderChart('chart-revenue', [
        { name: 'Revenue', color: '#e8a33d', points: data.points.map((p) => ({ t: p.t, v: p.revenue })) },
      ], { formatter: (v) => 'GHS ' + v });
    } catch (err) {
      document.getElementById('chart-revenue').innerHTML = `<div class="chart-empty">${err.message}</div>`;
    }
  }

  async function loadVouchersChart() {
    try {
      const data = await api(`/api/dashboard/history/vouchers?range=${trendRange}`);
      renderChart('chart-vouchers', [
        { name: 'Sold', color: '#2ec4b6', points: data.points.map((p) => ({ t: p.t, v: p.sold })) },
        { name: 'Redeemed', color: '#ffc55a', points: data.points.map((p) => ({ t: p.t, v: p.redeemed })) },
      ]);
    } catch (err) {
      document.getElementById('chart-vouchers').innerHTML = `<div class="chart-empty">${err.message}</div>`;
    }
  }

  async function loadClientsChart() {
    const el = document.getElementById('chart-clients');
    if (!trendSiteId) { el.innerHTML = '<div class="chart-empty">Add a site first.</div>'; return; }
    try {
      const data = await api(`/api/dashboard/history/clients?range=${trendRange}&siteId=${trendSiteId}`);
      renderChart('chart-clients', [
        { name: 'Avg clients', color: '#2ec4b6', points: data.points.map((p) => ({ t: p.t, v: p.avg })) },
        { name: 'Peak clients', color: '#ff6b6b', points: data.points.map((p) => ({ t: p.t, v: p.max })) },
      ]);
    } catch (err) {
      el.innerHTML = `<div class="chart-empty">${err.message}</div>`;
    }
  }

  async function loadUptimeChart() {
    const el = document.getElementById('chart-uptime');
    if (!trendSiteId) { el.innerHTML = '<div class="chart-empty">Add a site first.</div>'; return; }
    try {
      const data = await api(`/api/dashboard/history/uptime?range=${trendRange}&siteId=${trendSiteId}`);
      renderChart('chart-uptime', [
        { name: 'Uptime', color: '#2ec4b6', points: data.points.map((p) => ({ t: p.t, v: p.uptimePct })) },
      ], { formatter: (v) => v + '%' });
    } catch (err) {
      el.innerHTML = `<div class="chart-empty">${err.message}</div>`;
    }
  }

  window.addEventListener('beforeunload', () => {
    Object.values(liveState).forEach(s => { if (s.timer) clearInterval(s.timer); });
  });

  async function loadAgents() {
    const agents = await api('/api/agents');
    const rowsHtml = [];
    for (const a of agents) {
      const summary = await api(`/api/agents/${a.id}/summary`);
      rowsHtml.push(`<tr>
        <td>${a.name}</td>
        <td>${summary.vouchersSold}</td>
        <td>GHS ${summary.revenue}</td>
        <td>${summary.commissionPct}%</td>
        <td>GHS ${summary.commissionOwed}</td>
      </tr>`);
    }
    document.getElementById('agentsTable').innerHTML =
      '<tr><th>Agent</th><th>Sold</th><th>Revenue</th><th>Rate</th><th>Owed</th></tr>' +
      (rowsHtml.length ? rowsHtml.join('') : '<tr><td colspan="5" style="color:#6b8a91">No agents yet</td></tr>');
  }

  async function addAgent() {
    const msg = document.getElementById('agentMsg');
    try {
      await api('/api/agents', 'POST', {
        name: document.getElementById('agentName').value,
        commissionPct: Number(document.getElementById('agentCommission').value) || 10,
      });
      msg.textContent = 'Agent added.';
      document.getElementById('agentName').value = '';
      await loadAgents();
    } catch (err) {
      msg.textContent = err.message;
    }
  }

  loadDashboard();
</script>
</body>
</html>
