<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Print Vouchers</title>
<style>
  *{box-sizing:border-box}
  body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#0d1a1e;color:#e8f0f1;
    margin:0;padding:20px}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
  select,input{padding:9px;border-radius:8px;border:1px solid rgba(255,255,255,.15);
    background:#132228;color:#fff}
  button{padding:10px 16px;border:none;border-radius:8px;background:#e8a33d;color:#0d1a1e;
    font-weight:700;cursor:pointer}
  .grid{display:grid;grid-template-columns:repeat(auto-fill, 320px);gap:14px}
  .card{width:325px;height:205px;background:linear-gradient(135deg,#14282e,#0d1a1e);
    border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:16px;display:flex;
    justify-content:space-between;align-items:center;color:#e8f0f1}
  .card .left{flex:1}
  .card .brand{font-weight:800;color:#e8a33d;font-size:15px;margin-bottom:6px}
  .card .label{font-size:11px;color:#6b8a91;text-transform:uppercase;letter-spacing:.05em}
  .card .code{font-family:monospace;font-size:22px;font-weight:800;color:#2ec4b6;margin:6px 0}
  .card .price{font-size:12px;color:#ffc55a}
  .card img{width:90px;height:90px;background:#fff;border-radius:6px;padding:4px}
  #status{font-size:13px;color:#6b8a91;margin-bottom:14px}

  /* Print layout: match the original 86mm x 54mm card size, several per page */
  @media print {
    body{background:#fff;color:#000;padding:0}
    .toolbar{display:none}
    .grid{display:grid;grid-template-columns:repeat(2, 86mm);gap:4mm;justify-content:center}
    .card{width:86mm;height:54mm;background:#fff;border:1px dashed #999;color:#000}
    .card .brand{color:#b5761e}
    .card .code{color:#0d1a1e}
    .card .price{color:#555}
  }
</style>
</head>
<body>
<div id="yournetLangSwitcherContainer" style="display:flex;justify-content:flex-end;margin-bottom:10px"></div>
<div class="toolbar">
  <select id="statusFilter">
    <option value="unused">Unused only</option>
    <option value="">All</option>
  </select>
  <button onclick="load()" data-i18n="refresh">Refresh</button>
  <button onclick="window.print()" data-i18n="print">Print</button>
</div>
<div id="status" data-i18n="loading">Loading...</div>
<div class="grid" id="grid"></div>

<script src="/i18n/translations.js"></script>
<script src="/i18n/i18n-loader.js"></script>
<script>
  const token = localStorage.getItem('yournet_token');
  if (!token) {
    document.getElementById('status').textContent = 'Please log in via /admin first, then come back to this page.';
  }

  async function load() {
    const status = document.getElementById('statusFilter').value;
    const res = await fetch('/api/vouchers' + (status ? `?status=${status}` : ''), {
      headers: { Authorization: 'Bearer ' + token },
    });
    const vouchers = await res.json();
    document.getElementById('status').textContent = `${vouchers.length} voucher(s)`;

    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    for (const v of vouchers) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="left">
          <div class="brand">YourNet WiFi</div>
          <div class="label">Voucher Code</div>
          <div class="code">${v.code}</div>
          <div class="price">Scan or type at login</div>
        </div>
        <img alt="QR">
      `;
      grid.appendChild(card);

      // QR endpoint requires auth, so fetch it as an image blob instead of
      // a plain <img src> (which can't send an Authorization header).
      fetch(`/api/vouchers/${v.id}/qrcode`, { headers: { Authorization: 'Bearer ' + token } })
        .then(r => r.blob())
        .then(blob => { card.querySelector('img').src = URL.createObjectURL(blob); });
    }
  }

  if (token) load();
</script>
</body>
</html>
