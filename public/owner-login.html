<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owner Login</title>
<style>
  body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#0d1a1e;color:#e8f0f1;
    margin:0;padding:40px 20px;max-width:360px;margin-inline:auto}
  h1{font-size:20px}
  input{width:100%;padding:11px;border-radius:8px;border:1px solid rgba(255,255,255,.15);
    background:#132228;color:#fff;margin-bottom:10px;font-size:14px}
  button{width:100%;padding:11px;border:none;border-radius:8px;background:#e8a33d;color:#0d1a1e;
    font-weight:700;cursor:pointer;font-size:14px}
  .msg{margin-top:10px;font-size:13px;padding:10px;border-radius:8px;display:none}
  .msg.show{display:block}
  .msg.err{background:rgba(255,107,107,.12);color:#ff6b6b}
  .pwd-wrap{position:relative}
  .pwd-wrap input{padding-right:40px;margin-bottom:0}
  .pwd-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;
    border:none;cursor:pointer;font-size:16px;padding:4px 6px;margin:0;color:#6b8a91;line-height:1}
  .card{border-radius:14px;padding:20px}
  /* Glass mode: bg-rotate.js adds this to <body> once a rotating photo
     background is actually showing, so the card goes see-through only then. */
  body.yn-glass .card{background:rgba(19,34,40,.35);backdrop-filter:blur(16px) saturate(150%);
    -webkit-backdrop-filter:blur(16px) saturate(150%);border:1px solid rgba(255,255,255,.16)}
</style>
</head>
<body>
<script src="/bg-rotate.js"></script>
<div class="card">
<h1>Owner Login</h1>
<input id="username" placeholder="Username" autocomplete="username">
<div class="pwd-wrap" style="margin-bottom:10px">
  <input id="password" type="password" placeholder="Password" autocomplete="current-password">
  <button type="button" class="pwd-toggle" onclick="togglePwd('password')" aria-label="Show password">👁</button>
</div>
<button onclick="login()">Log in</button>
<div class="msg" id="msg"></div>
</div>

<script>
  function togglePwd(id) {
    const input = document.getElementById(id);
    const btn = input.nextElementSibling;
    if (input.type === 'password') {
      input.type = 'text';
      btn.textContent = '🙈';
      btn.setAttribute('aria-label', 'Hide password');
    } else {
      input.type = 'password';
      btn.textContent = '👁';
      btn.setAttribute('aria-label', 'Show password');
    }
  }

  async function login() {
    const msg = document.getElementById('msg');
    try {
      const res = await fetch('/owner/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Login failed');
      sessionStorage.setItem('yournet_owner_token', data.token);
      window.location.href = '/license-admin';
    } catch (err) {
      msg.textContent = err.message;
      msg.className = 'msg show err';
    }
  }

  document.getElementById('password').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') login();
  });
</script>
</body>
</html>
